name: hod_mod
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Core scientific stack
  - numpy
  - scipy
  - astropy
  - matplotlib
  - pandas
  # HDF5 / FITS I/O
  - h5py
  # YAML config loading
  - pyyaml
  # Jupyter / interactive
  - jupyter
  - ipykernel
  - ipywidgets
  - ipython
  # Utilities
  - tqdm
  # JAX ecosystem
  - jax
  - jaxlib
  # Dev & testing
  - pytest
  - pytest-cov
  - sphinx
  - sphinx-rtd-theme
  - numpydoc
  - pip
  - pip:
    # Linear power spectrum (Lewis, Challinor & Lasenby 2000).  Still required:
    # it is the reference the emulator is validated against, is the backend
    # behind HOD_MOD_PK_BACKEND=camb, and pk_camb_ratio.py needs it by design.
    - camb
    # DEFAULT linear P(k): CAMB-accurate (<0.1% in shape) JAX-differentiable
    # neural emulator (Piras & Spurio Mancini 2023).  Core dependency since it
    # became the default backend — without it ForwardModel/default_pk_linear()
    # raise ImportError.  The ~81 MB wheel BUNDLES its trained networks, so no
    # download happens at runtime (compute nodes need no outbound network);
    # install it on a node that can reach PyPI (e.g. a cluster login node).
    - cosmopower-jax
    # Halo profiles, concentration–mass relations (Diemer 2018, ApJS..239...35D)
    - colossus
    # MCMC sampling
    - emcee
    # On-demand Zenodo data fetcher (benchmark data + curated results)
    - pooch
    # Non-linear P(k) emulator — Aletheia (Sanchez 2025, arXiv:2511.13826)
    - AletheiaCosmo
    # Boltzmann solver — CLASS (Lesgourgues 2011)
    - classy
    - plotdigitizer
    - glass
