name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel a still-running Python leg when a sibling fails: a real
      # failure should surface as its actual error, not a SIGTERM "exit code 143".
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy scipy astropy matplotlib h5py pandas pyyaml tqdm
          pip install pooch platformdirs
          pip install "jax[cpu]"
          pip install emcee blackjax
          pip install camb colossus
          # Default linear P(k) backend since 0.3.1 — ForwardModel and
          # default_pk_linear() raise ImportError without it (no fallback).
          pip install cosmopower-jax
          pip install pytest pytest-cov

      - name: Install package (no-deps to skip classy/AletheiaCosmo)
        run: pip install -e . --no-deps

      - name: Run tests
        env:
          JAX_PLATFORMS: cpu
        run: |
          python -m pytest tests/ -q --tb=short \
            -k "not TestNonLinearPowerSpectrum" \
            -m "not x64" \
            --cov=hod_mod --cov-report=xml

      # x64-marked tests (gradient vs finite differences) need
      # JAX_ENABLE_X64=1, which is read once at jax import — hence a
      # separate pytest process, never a mid-session toggle.
      - name: Run x64 gradient tests
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
        run: python -m pytest tests/ -q --tb=short -m x64

      # In-package forecast production-parity tests. Not added to
      # testpaths: these modules flip jax_enable_x64 at import time, which
      # would poison the float32 assumptions of the main suite in-process.
      - name: Run forecast production-parity tests (x64 in-package)
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest hod_mod/forecast/tests -q --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
