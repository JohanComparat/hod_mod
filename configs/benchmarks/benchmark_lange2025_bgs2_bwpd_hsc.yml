# DESI DR1 BGS2 joint wp+ESD (HSC-Y3) benchmark — manually digitized data (Lange+2025, arXiv:2512.15962)
# Data: wp_bgs2_bwpd.csv + ds_hsc_bgs2_bwpd.csv — manually digitized via WebPlotDigitizer
# wp format:  rp_hMpc, rp*wp [(Mpc/h)^2], upper_rp*wp [(Mpc/h)^2]; err = upper - value
# ESD format: rp_hMpc, rp*DS [10^6 M_sun/pc], upper_rp*DS [10^6 M_sun/pc]; err = upper - value
# DES ESD is excluded; only HSC-Y3 lensing is used.

data:
  file:   data/lange2025_desi_dr1/BGS2/wp_bgs2_bwpd.csv
  format: bwpd
  rp_min: 0.4
  rp_max: 63.0

joint:
  ds_file:      data/lange2025_desi_dr1/BGS2/ds_hsc_bgs2_bwpd.csv
  ds_format:    bwpd
  ds_rp_min:    2.5
  ds_rp_max:    40.0
  ng_obs:       3.71e-3
  ng_frac_err:  0.10

cosmology:
  Omega_m: 0.3153
  h:       0.6736
  ln10^{10}A_s: 3.008785  # from sigma8 = 0.8111, converted via CAMB
  n_s:     0.9649
  Omega_b: 0.0493

model:
  hod_model:   Lange25HODModel
  hmf_backend: tinker08
  z:           0.25
  pi_max:      80.0

parameters:
  log10mmin:  {free: true,  bounds: [11.0, 15.0], init: 12.0}
  sigma_logm: {free: true,  bounds: [0.1,  1.0],  init: 0.4}
  log10m0:    {free: true,  bounds: [11.0, 15.0], init: 12.5}
  log10m1:    {free: true,  bounds: [11.0, 15.0], init: 13.5}
  alpha:      {free: true,  bounds: [0.5,  2.0],  init: 1.0}
  f_Gamma:    {free: true,  bounds: [0.5,  1.0],  init: 1.0}
  A_cen:      {free: true,  bounds: [-1.0, 1.0],  init: 0.0}
  A_sat:      {free: true,  bounds: [-1.0, 1.0],  init: 0.0}
  Omega_m:
    free:        true
    bounds:      [0.279, 0.352]
    init:        0.3153
    prior_type:  gaussian
    prior_mean:  0.3153
    prior_sigma: 0.0073
  # The amplitude, sampled directly.  This was S8 with a Planck Gaussian
  # prior; S8 is now DERIVED from (ln10^{10}A_s, Omega_m) after the fit.  Flat
  # and wide on purpose -- the point of this benchmark is to measure the
  # amplitude from the data, so it carries no amplitude prior.  The upper edge
  # stays inside the CosmoPower training box (1.61, 3.91) so a walker cannot
  # leave it; the range spans sigma8 ~ 0.48-1.24, ~20 sigma on the published S8.
  ln10^{10}A_s:
    free:        true
    bounds:      [2.0, 3.9]
    init:        3.044

fitting:
  method:         map
  n_walkers:      64
  n_steps:        4000
  n_burnin:       1000
  use_free_cosmo: true

output:
  dir: results/benchmarks/lange2025/bgs2_bwpd_hsc/
