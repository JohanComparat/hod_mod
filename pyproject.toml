[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hod_mod"
version = "0.3.1"
description = "HOD galaxy clustering and weak lensing prediction and fitting"
authors = [{name = "Johan Comparat", email = "johan.comparat@pm.me"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "camb",
    "colossus",
    "h5py",
    "jax",
    "jaxlib",
    "pooch",
    "platformdirs",
    "AletheiaCosmo",
]

[project.scripts]
hod-mod = "hod_mod.cli.__main__:main"

[project.optional-dependencies]
fitting   = ["emcee", "pyyaml", "pandas"]
# blackjax powers the gradient-based NUTS sampler in fitting/jax_inference.py;
# optional (run_nuts raises a clear ImportError if absent).
inference = ["blackjax"]
dev       = ["pytest", "pytest-cov", "sphinx", "sphinx-rtd-theme", "numpydoc", "blackjax"]
# Optional emulator backends are git-only (not on PyPI). They are NOT declared as
# extras here because PyPI forbids direct-URL dependencies in uploaded metadata.
# Install them manually when you need make_hmf("csst") / make_hmf("aemulusnu"):
#   pip install git+https://github.com/czymh/csstemu
#   pip install git+https://github.com/DelonShen/aemulusnu_hmf

[tool.setuptools.packages.find]
where = ["."]
include = ["hod_mod*"]

[tool.setuptools.package-data]
"hod_mod.data_io" = ["registry.txt"]
"hod_mod.data.agn" = ["*.txt", "*.ascii"]
"hod_mod.data.benchmarks" = ["*.csv", "*.json"]
"hod_mod.data.bnl" = ["*.npy", "*.txt"]
"hod_mod.data.erosita" = ["*.npz"]
"hod_mod.data.apec_bands" = ["*.npz"]
"hod_mod.data.pk_ratio" = ["*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (build the CAMB static cache / JAX JIT); deselect with -m 'not slow'",
    "x64: needs JAX_ENABLE_X64=1 (gradient-vs-finite-difference checks); run as a separate pytest process",
]

[tool.coverage.run]
omit = ["*/hod_mod/scripts/*"]

[tool.coverage.report]
omit = ["*/hod_mod/scripts/*"]
# Floor enforced when coverage is reported (CI: `pytest -m "" --cov=hod_mod`).
# Full suite measures 87.6% (2026-07, after the differentiable-inference waves);
# the ~2-point margin covers environments where the soxs/CEmulator-gated `slow`
# tests skip. Not applied to plain `pytest`.
fail_under = 85
